# PoC 用の依存サービス。
#
#   正常系:  docker compose up -d
#   異常系 (第1層): LITELLM_CONFIG_FILE=config.fault.yaml FAULT_MODE=rate_limit docker compose up -d
#   異常系 (第2層): LITELLM_CONFIG_FILE=config.fault.yaml FAULT_MODE=malformed \
#                   FAULT_FIXTURE=v01_prose docker compose up -d
#   異常系 (第3層): docker compose stop opa                      # X-01 接続不能
#                   OPA_POLICY_DIR=./mocks/opa_faults/no_policy docker compose up -d opa   # X-04
#                   OPA_POLICY_DIR=./mocks/opa_faults/allow_as_string docker compose up -d opa  # X-05
#
# エージェント本体 (agents/) はホストの venv から実行する。

services:
  # ── 第1層: LiteLLM Proxy ─────────────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: safety-net-litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm:/app/litellm:ro
    command:
      - "--config"
      - "/app/litellm/${LITELLM_CONFIG_FILE:-config.yaml}"
      - "--port"
      - "4000"
      - "--detailed_debug"   # フォールバック発火をログで追うため
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    depends_on:
      - fault-injector

  # ── 障害注入サーバ（異常系でのみ参照される）──────────────
  fault-injector:
    image: python:3.12-slim
    container_name: safety-net-fault-injector
    ports:
      - "8080:8080"
    volumes:
      - ./mocks:/app:ro
      # 壊れた content の元ネタ。単体検証 (pytest) と同じ fixture を共用する。
      # /app は :ro なので、その下にマウントポイントを作れない。独立したパスに置く。
      - ./tests/fixtures:/fixtures:ro
    working_dir: /app
    command: ["python", "fault_injector.py"]
    environment:
      FAULT_MODE: ${FAULT_MODE:-server_error}
      FAULT_DELAY_SECONDS: ${FAULT_DELAY_SECONDS:-45}
      # FAULT_MODE=malformed のときだけ参照される。予約名 null_content は content: null
      FAULT_FIXTURE: ${FAULT_FIXTURE:-v01_prose}
      FAULT_FIXTURE_DIR: /fixtures
      PORT: "8080"

  # ── 第3層: OPA ──────────────────────────────────────
  # Phase 3 から既定で起動する（profiles を外した）。第3層の不在を
  # 「たまたま起動していなかった」で誤魔化さないため（D-014 の趣旨）。
  opa:
    # バージョンは固定する。検証の再現性のため latest を使わない。
    image: openpolicyagent/opa:1.21.0
    container_name: safety-net-opa
    ports:
      - "8181:8181"
    volumes:
      # 既定は正本の ./opa。異常系 (X-04 / X-05) では mocks/opa_faults/* に差し替える。
      - ${OPA_POLICY_DIR:-./opa}:/policies:ro
    command:
      - "run"
      - "--server"
      - "--addr"
      - "0.0.0.0:8181"
      # ポリシーファイルの変更を再起動なしで反映する。M-01（ポリシーの独立変更）で使う。
      - "--watch"
      # 判定の記録を stdout に出す。これが「層の外側からの裏取り」の主エビデンスになる
      # （docker compose logs opa）。D-009 / D-014 の第3層版。
      - "--set=decision_logs.console=true"
      - "/policies"
